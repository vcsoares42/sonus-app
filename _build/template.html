<!DOCTYPE html>
<html lang="{{LANG}}"{{DIR}}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META}}">
{{ALTERNATES}}
  <style>
    :root {
      --fundo: #ffffff;
      --texto: #111111;
      --texto-suave: #3a3a3c;
      --acento: #E07F00;
      --acento-suave: rgba(255, 149, 0, 0.10);
      --hairline: rgba(0, 0, 0, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0e0e12;
        --texto: #f2f2f7;
        --texto-suave: #b9b9c0;
        --acento: #FF9F0A;
        --acento-suave: rgba(255, 159, 10, 0.14);
        --hairline: rgba(255, 255, 255, 0.16);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--fundo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.65;
      padding: 48px 20px 80px;
    }
    main { max-width: 640px; margin: 0 auto; }
    .idiomas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
      font-size: 0.85rem;
    }
    .idiomas a, .idiomas .ativo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      color: var(--texto-suave);
      text-decoration: none;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .idiomas a:hover { border-color: var(--acento); color: var(--acento); }
    .idiomas .ativo {
      border-color: var(--acento);
      color: var(--acento);
      background: var(--acento-suave);
      font-weight: 600;
    }
    .idiomas .bandeira { font-size: 1rem; line-height: 1; }
    .eyebrow {
      color: var(--acento);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
    }
    h1 { font-size: 2rem; line-height: 1.2; margin-bottom: 4px; letter-spacing: -0.01em; }
    .atualizacao { color: var(--texto-suave); font-size: 0.9rem; margin-bottom: 32px; }
    h2 {
      font-size: 1.25rem;
      margin: 36px 0 10px;
      padding-top: 24px;
      border-top: 1px solid var(--hairline);
    }
    p { margin-bottom: 14px; }
    ul { margin: 0 0 14px; padding-inline-start: 22px; }
    li { margin-bottom: 6px; }
    a { color: var(--acento); }
    .contato {
      margin-top: 40px;
      padding: 18px 20px;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      color: var(--texto-suave);
      font-size: 0.95rem;
    }
    footer {
      max-width: 640px;
      margin: 56px auto 0;
      color: var(--texto-suave);
      font-size: 0.85rem;
      border-top: 1px solid var(--hairline);
      padding-top: 20px;
    }
    footer a { color: var(--texto-suave); }
  </style>
</head>
<body>
  <main>
    <nav class="idiomas" aria-label="{{NAV_LABEL}}">
{{PILLS}}
    </nav>

    <p class="eyebrow">Sonus</p>
    <h1>{{H1}}</h1>
    <p class="atualizacao">{{UPDATED}}</p>

{{BODY}}
  </main>

  <footer>
    <a href="index.html">{{HOME}}</a> · © Vinícius Soares
  </footer>
</body>
</html>
